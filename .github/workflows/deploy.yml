# ── Task 10: CI/CD Pipeline ──
# flow: push main → build amd64 → push Docker Hub (:version) → ssh server → pull+up -d → webhook alert
name: CI/CD - Build & Deploy Blog API

on:
  push:
    branches: [main]

env:
  IMAGE: phxpoom/project-for-presentation # ชื่อ image บน Docker Hub (user/repo)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 2) checkout branch main
      - name: Checkout main
        uses: actions/checkout@v4

      # tag = git short SHA (เวอร์ชันไม่ซ้ำทุก push, ไม่ใช่ latest)
      - name: Set image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3) build image (สถาปัตยกรรม amd64) + 4) push ขึ้น Docker Hub ด้วย :tag (version)
      - name: Build & push image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}

      # 5) ssh เข้า server → 6) pull image ที่เพิ่ง push → 7) docker up -d ให้ golive
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE=${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            echo "Pulling $IMAGE ..."
            docker pull "$IMAGE"

            # รัน container api ตัวใหม่แทนตัวเดิม (อยู่ network เดียวกับ mongo/nginx)
            docker stop api 2>/dev/null || true
            docker rm api 2>/dev/null || true
            docker run -d --name api --restart unless-stopped \
              --network api_network \
              -e MONGODB_URI=mongodb://mongo:27017/blog \
              -e HOST=0.0.0.0 \
              -e PORT=4321 \
              "$IMAGE"

            # ให้ nginx รู้จัก IP ใหม่ของ api (กัน 502 หลัง container เปลี่ยน IP)
            docker exec nginx nginx -s reload || true

            # เก็บกวาด image เก่าที่ไม่ใช้
            docker image prune -f

      # 8) webhook แจ้งเตือนเมื่อ deploy สำเร็จ (Discord)
      - name: Notify success (Discord webhook)
        if: success()
        run: |
          curl -fsS -H "Content-Type: application/json" \
            -d "{\"content\":\"✅ Deploy สำเร็จ — \`${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}\` ขึ้น production แล้ว\\ncommit: ${{ github.sha }}\\nby: ${{ github.actor }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      # (เสริม) แจ้งเตือนเมื่อ deploy ล้มเหลว
      - name: Notify failure (Discord webhook)
        if: failure()
        run: |
          curl -fsS -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ Deploy ล้มเหลว — commit ${{ github.sha }} (ดู log ใน GitHub Actions)\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
